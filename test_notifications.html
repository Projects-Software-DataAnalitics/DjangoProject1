<!-- Test script to check notification system -->
<!-- Add this temporarily to student_base.html before </body> to debug -->

<script>
console.log('=== Notification System Debug ===');
console.log('unread_notifications_count:', {{ unread_notifications_count|default:0 }});
console.log('unread_notifications length:', {{ unread_notifications|length|default:0 }});
console.log('unread_notifications:', {{ unread_notifications|safe|default:"[]" }});

const notificationBtn = document.getElementById('notification-btn');
if (notificationBtn) {
    console.log('Notification button found');
    console.log('data-has-notifications:', notificationBtn.getAttribute('data-has-notifications'));
    console.log('Button color:', window.getComputedStyle(notificationBtn).color);
} else {
    console.error('Notification button NOT found!');
}

const notificationIcon = document.getElementById('notification-icon');
if (notificationIcon) {
    console.log('Notification icon found');
    console.log('Icon color:', window.getComputedStyle(notificationIcon).color);
} else {
    console.error('Notification icon NOT found!');
}
</script>
