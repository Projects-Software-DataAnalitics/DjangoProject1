{% extends "faculty/base.html" %}

{% block title %}Faculty Head Grades{% endblock %}

{% block content %}
    <h1 style="font-size: 32px; margin: 0 0 24px 0;">Grades</h1>

    <div style="margin-top: 16px;">
        <label for="fh-course-select" style="display: block; margin-bottom: 8px; font-weight: 600; color: #0f172a;">
            Select Course
        </label>
        <select id="fh-course-select" style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; max-width: 400px; background: #f8fafc; font-size: 14px; cursor: pointer;">
            <option value="">-- Select a course --</option>
            {% for course in faculty_head_courses %}
            <option value="{{ course }}">{{ course }}</option>
            {% endfor %}
        </select>
    </div>

    <script>
        document.getElementById("fh-course-select").addEventListener("change", function() {
            const selectedCourse = this.value;
            if (selectedCourse) {
                window.location.href = `/faculty-head/grades/${encodeURIComponent(selectedCourse)}/`;
            }
        });
    </script>
{% endblock %}
