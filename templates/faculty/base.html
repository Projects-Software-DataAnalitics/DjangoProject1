<!DOCTYPE html>
<html lang="en">
<head>

    {% load static %}

</head>
<body>
<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <ul>
        <li><a href="{% url 'faculty_head_profile' %}">Personal Information</a></li>
        <li><a href="{% url 'faculty-head-grades' %}">Grades</a></li>
        <li><a href="{% url 'all_courses' %}">All Courses</a></li>

<div class="content" id="content">

<script src="{% static 'js/faculty_head.js' %}"></script>
