<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Smart School System</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="login-body">
    <main class="login-wrapper">
        <section class="login-hero">
            <h1 class="app-title">Forgot Password</h1>
            <p class="app-subtitle">Enter your username or email to reset your password</p>
        </section>

        <section class="login-form-container">
            <a href="{% url 'home' %}" class="back-btn">← Back</a>
            <form method="POST" class="login-form">
                {% csrf_token %}
                <label class="input-label" for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" placeholder="Enter your username or email" required>
                <button type="submit" class="primary-btn">Reset Password</button>
            </form>
            {% if error %}
                <p class="error-text">{{ error }}</p>
            {% endif %}
        </section>

        <footer class="login-footer">© {{ now|date:'Y' }} Smart School</footer>
    </main>
</body>
</html>
