<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Instructor Login - Smart School System</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body class="login-body">

    <main class="login-wrapper">

        <section class="login-hero">
            <h1 class="app-title">Instructor Login</h1>
        </section>

        <section class="login-form-container">
            <a href="{% url 'home' %}" class="back-btn">← Back</a>
            <form id="instructor-login-form" class="login-form">
                {% csrf_token %}
                <label class="input-label" for="instructor-username">Username</label>
                <input type="text" id="instructor-username" placeholder="Enter your username" required>
                <label class="input-label" for="instructor-password">Password</label>
                <input type="password" id="instructor-password" placeholder="Enter your password" required>
                <button type="submit" class="primary-btn">Login</button>
            </form>
            <p id="instructor-login-error" class="error-text"></p>
            <div style="text-align: center; margin-top: 15px;">
                <a href="{% url 'forgot-password' %}" style="color: #666; text-decoration: none; font-size: 14px;">Forgot Password?</a>
            </div>
        </section>

        <footer class="login-footer">© {{ now|date:'Y' }} Smart School</footer>

    </main>

    <script>
        function getCsrfToken() {
            const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
            if (csrfInput) {
                return csrfInput.value;
            }
            const cookieMatch = document.cookie.match(/csrftoken=([^;]+)/);
            return cookieMatch ? cookieMatch[1] : null;
        }

        const instructorForm = document.getElementById("instructor-login-form");
        instructorForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("instructor-username").value;
            const password = document.getElementById("instructor-password").value;
            const errorElement = document.getElementById("instructor-login-error");

            if (!username || !password) {
                errorElement.textContent = "Please enter both username and password!";
                return;
            }

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('csrfmiddlewaretoken', getCsrfToken());

            fetch("{% url 'instructor-login' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCsrfToken()
                }
            })
            .then(response => {
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    return response.json().then(data => {
                        return { data: data, ok: response.ok, status: response.status };
                    });
                } else {
                    return response.text().then(text => {
                        throw new Error('Server returned invalid response format');
                    });
                }
            })
            .then(result => {
                const data = result.data;
                if (result.ok && data.status === 'success') {
                    sessionStorage.setItem('loggedInstructor', JSON.stringify({username: username}));
                    window.location.href = "{% url 'instructor' %}";
                } else {
                    errorElement.textContent = data.message || "Invalid username or password!";
                }
            })
            .catch(error => {
                errorElement.textContent = error.message || "Login failed. Please try again.";
            });
        });
    </script>

</body>

</html>
