<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Instructor Login - Smart School System</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body class="login-body">

    <main class="login-wrapper">

        <section class="login-hero">
            <h1 class="app-title">Instructor Login</h1>
        </section>

        <section class="login-form-container">
            <a href="{% url 'home' %}" class="back-btn">← Back</a>
            <form id="instructor-login-form" class="login-form">
                {% csrf_token %}
                <label class="input-label" for="instructor-username">Username</label>
                <input type="text" id="instructor-username" placeholder="Enter your username" required>
                <label class="input-label" for="instructor-password">Password</label>
                <input type="password" id="instructor-password" placeholder="Enter your password" required>
                <button type="submit" class="primary-btn">Login</button>
            </form>
            <p id="instructor-login-error" class="error-text"></p>
        </section>

        <footer class="login-footer">© {{ now|date:'Y' }} Smart School</footer>

    </main>

    <script>
        function getCsrfToken() {
            const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
            if (csrfInput) {
                return csrfInput.value;
            }
            const cookieMatch = document.cookie.match(/csrftoken=([^;]+)/);
            return cookieMatch ? cookieMatch[1] : null;
        }

        const instructorForm = document.getElementById("instructor-login-form");
        instructorForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("instructor-username").value;
            const password = document.getElementById("instructor-password").value;
            const errorElement = document.getElementById("instructor-login-error");

            if (!username || !password) {
                errorElement.textContent = "Please enter both username and password!";
                return;
            }

            fetch("{% static 'json/instructors.json' %}")
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load instructor data');
                    }
                    return response.json();
                })
                .then(data => {
                    const instructor = data.find(i => i.username === username && i.password === password);
                    if(instructor) {
                        sessionStorage.setItem('loggedInstructor', JSON.stringify(instructor));
                        
                        const csrfToken = getCsrfToken();
                        fetch("{% url 'set_instructor_session' %}", {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                                'X-CSRFToken': csrfToken || ''
                            },
                            body: `username=${encodeURIComponent(username)}`
                        })
                        .then(response => {
                            if (response.ok) {
                                window.location.href = "{% url 'instructor' %}";
                            } else {
                                errorElement.textContent = "Login failed. Please try again.";
                            }
                        })
                        .catch(error => {
                            console.error('Error setting session:', error);
                            errorElement.textContent = "Login failed. Please try again.";
                        });
                    } else {
                        errorElement.textContent = "Invalid username or password!";
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    errorElement.textContent = "Error loading instructor data. Please try again.";
                });
        });
    </script>

</body>

</html>
