<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Faculty Head Login - Smart School System</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body class="login-body">

    <main class="login-wrapper">

        <section class="login-hero">
            <h1 class="app-title">Faculty Head Login</h1>
        </section>

        <section class="login-form-container">
            <a href="{% url 'home' %}" class="back-btn">← Back</a>
            <form id="faculty-head-login-form" class="login-form" method="POST">
                {% csrf_token %}
                <label class="input-label" for="faculty-head-username">Username</label>
                <input type="text" id="faculty-head-username" name="username" placeholder="Enter your username" required>
                <label class="input-label" for="faculty-head-password">Password</label>
                <input type="password" id="faculty-head-password" name="password" placeholder="Enter your password" required>
                <button type="submit" class="primary-btn">Login</button>
            </form>
            {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
        </section>

        <footer class="login-footer">© {{ now|date:'Y' }} Smart School</footer>

    </main>

    <script>
        // Form POST ile submit edilecek, JavaScript'e gerek yok
    </script>

</body>

</html>
