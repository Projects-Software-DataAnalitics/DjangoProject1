<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Student Login - Smart School System</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body class="login-body">

    <main class="login-wrapper">

        <section class="login-hero">
            <h1 class="app-title">Student Login</h1>
        </section>

        <section class="login-form-container">
            <a href="{% url 'home' %}" class="back-btn">← Back</a>
            <form id="student-login-form" class="login-form">
                {% csrf_token %}
                <label class="input-label" for="student-username">Username</label>
                <input type="text" id="student-username" placeholder="Enter your username" required>
                <label class="input-label" for="student-password">Password</label>
                <input type="password" id="student-password" placeholder="Enter your password" required>
                <button type="submit" class="primary-btn">Login</button>
            </form>
            <p id="student-login-error" class="error-text"></p>
        </section>

        <footer class="login-footer">© {{ now|date:'Y' }} Smart School</footer>

    </main>

    <script>
        function getCsrfToken() {
            const cookieMatch = document.cookie.match(/csrftoken=([^;]+)/);
            return cookieMatch ? cookieMatch[1] : null;
        }

        const studentForm = document.getElementById("student-login-form");
        studentForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("student-username").value;
            const password = document.getElementById("student-password").value;
            const errorElement = document.getElementById("student-login-error");

            if (!username || !password) {
                errorElement.textContent = "Please enter both username and password!";
                return;
            }

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('csrfmiddlewaretoken', getCsrfToken());

            fetch("{% url 'student-login' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCsrfToken()
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    sessionStorage.setItem('loggedStudent', JSON.stringify({username: username}));
                    window.location.href = `/student/`;
                } else {
                    errorElement.textContent = data.message || "Invalid username or password!";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorElement.textContent = "Login failed. Please try again.";
            });
        });
    </script>

</body>

</html>
