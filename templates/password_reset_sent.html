<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset - Smart School System</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .message-box {
            background: {% if success %}#d4edda{% else %}#f8d7da{% endif %};
            border: 1px solid {% if success %}#c3e6cb{% else %}#f5c6cb{% endif %};
            color: {% if success %}#155724{% else %}#721c24{% endif %};
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        .info-box {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            color: #004085;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body class="login-body">
    <main class="login-wrapper">
        <section class="login-hero">
            <h1 class="app-title">Password Reset</h1>
        </section>

        <section class="login-form-container">
            <div class="message-box">
                {{ message }}
            </div>
            
            {% if success %}
            <div class="info-box">
                <strong>Important:</strong> Please check your email inbox (and spam folder) for the new password. 
                After logging in, we recommend changing your password for security.
            </div>
            {% endif %}

            <div style="text-align: center; margin-top: 20px;">
                <a href="{% url 'home' %}" class="primary-btn" style="display: inline-block; text-decoration: none;">Back to Login</a>
            </div>
        </section>

        <footer class="login-footer">© {{ now|date:'Y' }} Smart School</footer>
    </main>
</body>
</html>
