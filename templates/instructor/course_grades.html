{% extends "instructor.html" %}
{% load static %}

{% block content %}
<h1>Grades Management - {{ course.name }}</h1>

<!-- Assessment Management Section -->
<div style="margin: 30px 0; padding: 20px; background: #e0f2fe; border-radius: 8px; border: 1px solid #dee2e6;">
    <h2 style="margin-top: 0; margin-bottom: 20px; color: #0f172a;">Assessment Management</h2>
    
    <!-- Assessment Counts Section -->
    <div style="margin-bottom: 30px;">
        <h3 style="margin-top: 0; margin-bottom: 15px; color: #0f172a; font-size: 18px;">Assessment Counts</h3>
        <form id="assessment-form" style="display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
            <div style="flex: 0 0 auto;">
                <label for="midterm" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Midterm</label>
                <input type="number" id="midterm" name="midterm" value="{{ assessment.midterm }}" 
                       min="0" max="9" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="final" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Final</label>
                <input type="number" id="final" name="final" value="{{ assessment.final }}" 
                       min="0" max="9" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="proje" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Proje</label>
                <input type="number" id="proje" name="proje" value="{{ assessment.proje }}" 
                       min="0" max="9" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="homework" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Homework</label>
                <input type="number" id="homework" name="homework" value="{{ assessment.homework }}" 
                       min="0" max="9" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="absence" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Absence</label>
                <input type="number" id="absence" name="absence" value="{{ assessment.absence }}" 
                       min="0" max="9" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="quiz" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Quiz</label>
                <input type="number" id="quiz" name="quiz" value="{{ assessment.quiz }}" 
                       min="0" max="9" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto; margin-left: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Total Count</label>
                <div id="assessment-count-display" style="width: 100px; padding: 8px; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; font-weight: bold; color: #0f172a; text-align: center;">
                    {{ assessment.assessment_count }}
                </div>
            </div>
        </form>
    </div>
    
    <!-- Assessment Percentages Section -->
    <div>
        <h3 style="margin-top: 0; margin-bottom: 15px; color: #0f172a; font-size: 18px;">Assessment Percentages</h3>
        <form id="assessment-percentages-form" style="display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
            <div style="flex: 0 0 auto;">
                <label for="midterm_percentage" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Midterm %</label>
                <input type="number" id="midterm_percentage" name="midterm_percentage" value="{{ assessment.midterm_percentage }}" 
                       min="0" max="100" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="final_percentage" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Final %</label>
                <input type="number" id="final_percentage" name="final_percentage" value="{{ assessment.final_percentage }}" 
                       min="0" max="100" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="proje_percentage" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Proje %</label>
                <input type="number" id="proje_percentage" name="proje_percentage" value="{{ assessment.proje_percentage }}" 
                       min="0" max="100" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="homework_percentage" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Homework %</label>
                <input type="number" id="homework_percentage" name="homework_percentage" value="{{ assessment.homework_percentage }}" 
                       min="0" max="100" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="absence_percentage" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Absence %</label>
                <input type="number" id="absence_percentage" name="absence_percentage" value="{{ assessment.absence_percentage }}" 
                       min="0" max="100" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto;">
                <label for="quiz_percentage" style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Quiz %</label>
                <input type="number" id="quiz_percentage" name="quiz_percentage" value="{{ assessment.quiz_percentage }}" 
                       min="0" max="100" step="1" required
                       style="width: 80px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            
            <div style="flex: 0 0 auto; margin-left: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #0f172a; font-size: 14px;">Total %</label>
                <div id="percentage-count-display" style="width: 100px; padding: 8px; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; font-weight: bold; color: #0f172a; text-align: center;">
                    {{ assessment.percentage_count }}
                </div>
            </div>
        </form>
    </div>
    
    <!-- Combined Save Button -->
    <button type="button" id="save-all-btn" 
            style="padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer;">
        Save
    </button>
    
    <!-- Combined Message Display -->
    <div id="combined-message" style="margin-top: 15px; padding: 12px; border-radius: 6px; display: none;"></div>
</div>

<script>
function getCsrfToken() {
    const cookieMatch = document.cookie.match(/csrftoken=([^;]+)/);
    return cookieMatch ? cookieMatch[1] : null;
}

(function() {
    'use strict';
    
    const courseName = "{{ course.name|escapejs }}";
    const assessmentForm = document.getElementById('assessment-form');
    const saveAllBtn = document.getElementById('save-all-btn');
    const combinedMessageDiv = document.getElementById('combined-message');
    const countDisplay = document.getElementById('assessment-count-display');
    
    // Input değişikliklerinde toplamı güncelle
    const inputs = assessmentForm.querySelectorAll('input[type="number"]');
    inputs.forEach(input => {
        input.addEventListener('input', function() {
            updateTotal();
        });
    });
    
    function updateTotal() {
        let total = 0;
        inputs.forEach(input => {
            const value = parseInt(input.value) || 0;
            total += value;
        });
        countDisplay.textContent = total;
    }
    
    // Sayfa yüklendiğinde toplamı güncelle
    updateTotal();
    
    // Combined Save butonu
    saveAllBtn.addEventListener('click', function() {
        // Mesaj div'ini temizle
        combinedMessageDiv.style.display = 'none';
        combinedMessageDiv.innerHTML = '';
        
        // Assessment Count verilerini al
        const countData = {
            midterm: parseInt(document.getElementById('midterm').value),
            final: parseInt(document.getElementById('final').value),
            proje: parseInt(document.getElementById('proje').value),
            homework: parseInt(document.getElementById('homework').value),
            absence: parseInt(document.getElementById('absence').value),
            quiz: parseInt(document.getElementById('quiz').value)
        };
        
        // Assessment Percentage verilerini al
        const percentageData = {
            midterm_percentage: parseInt(document.getElementById('midterm_percentage').value),
            final_percentage: parseInt(document.getElementById('final_percentage').value),
            proje_percentage: parseInt(document.getElementById('proje_percentage').value),
            homework_percentage: parseInt(document.getElementById('homework_percentage').value),
            absence_percentage: parseInt(document.getElementById('absence_percentage').value),
            quiz_percentage: parseInt(document.getElementById('quiz_percentage').value)
        };
        
        // Validation: Assessment Count - Integer kontrolü ve 10'dan küçük olması
        let countErrors = [];
        for (const [key, value] of Object.entries(countData)) {
            if (isNaN(value) || !Number.isInteger(value)) {
                countErrors.push(`${key.charAt(0).toUpperCase() + key.slice(1)} must be an integer. If there is no value, enter 0.`);
            } else if (value < 0) {
                countErrors.push(`You have to write a positive number.`);
                break; // İlk negatif değerde dur
            } else if (value >= 10) {
                countErrors.push(`${key.charAt(0).toUpperCase() + key.slice(1)} must be less than 10.`);
            }
        }
        
        // Validation: Assessment Percentage - Integer kontrolü
        let percentageErrors = [];
        for (const [key, value] of Object.entries(percentageData)) {
            if (isNaN(value) || !Number.isInteger(value)) {
                percentageErrors.push(`${key.replace('_', ' ')} must be an integer.`);
            } else if (value < 0) {
                percentageErrors.push(`You have to write a positive number.`);
                break; // İlk negatif değerde dur
            } else if (value > 100) {
                percentageErrors.push(`${key.replace('_', ' ')} cannot be greater than 100.`);
            }
        }
        
        // Assessment Count kontrolü: Percentage > 0 ise, count > 0 olmalı
        const missingAssessments = [];
        const assessmentMapping = {
            'midterm_percentage': { count: 'midterm', name: 'Midterm' },
            'final_percentage': { count: 'final', name: 'Final' },
            'proje_percentage': { count: 'proje', name: 'Proje' },
            'homework_percentage': { count: 'homework', name: 'Homework' },
            'absence_percentage': { count: 'absence', name: 'Absence' },
            'quiz_percentage': { count: 'quiz', name: 'Quiz' }
        };
        
        for (const [percentageKey, percentageValue] of Object.entries(percentageData)) {
            if (percentageValue > 0) {
                const mapping = assessmentMapping[percentageKey];
                if (countData[mapping.count] === 0) {
                    missingAssessments.push(`You haven't assigned a ${mapping.name} yet.`);
                }
            }
        }
        
        // Important mesajları: Count > 0 ama percentage == 0
        const importantWarnings = [];
        const countToPercentageMapping = {
            'midterm': 'midterm_percentage',
            'final': 'final_percentage',
            'proje': 'proje_percentage',
            'homework': 'homework_percentage',
            'absence': 'absence_percentage',
            'quiz': 'quiz_percentage'
        };
        const countToNameMapping = {
            'midterm': 'Midterm',
            'final': 'Final',
            'proje': 'Proje',
            'homework': 'Homework',
            'absence': 'Absence',
            'quiz': 'Quiz'
        };
        
        for (const [countKey, countValue] of Object.entries(countData)) {
            if (countValue > 0) {
                const percentageKey = countToPercentageMapping[countKey];
                const percentageValue = percentageData[percentageKey] || 0;
                if (percentageValue === 0) {
                    const name = countToNameMapping[countKey];
                    importantWarnings.push(`You haven't assigned a percentage for ${name}.`);
                }
            }
        }
        
        // Toplam 100 kontrolü
        const totalPercentage = Object.values(percentageData).reduce((sum, val) => sum + val, 0);
        if (totalPercentage !== 100) {
            percentageErrors.push(`Total percentage must be exactly 100. Current total: ${totalPercentage}`);
        }
        
        // Tüm hataları birleştir
        const allErrors = [...countErrors, ...percentageErrors, ...missingAssessments, ...importantWarnings];
        
        if (allErrors.length > 0) {
            combinedMessageDiv.style.display = 'block';
            combinedMessageDiv.style.background = '#fee2e2';
            combinedMessageDiv.style.color = '#dc2626';
            combinedMessageDiv.style.border = '1px solid #fca5a5';
            combinedMessageDiv.innerHTML = allErrors.join('<br>');
            return;
        }
        
        // Her iki API'ye de gönder
        const countPromise = fetch(`/instructor/grades/${courseName}/update-assessment/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify(countData)
        }).then(response => response.json());
        
        const percentagePromise = fetch(`/instructor/grades/${courseName}/update-assessment-percentages/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify(percentageData)
        }).then(response => response.json());
        
        Promise.all([countPromise, percentagePromise])
        .then(([countResult, percentageResult]) => {
            if (countResult.status === 'ok' && percentageResult.status === 'ok') {
                combinedMessageDiv.style.display = 'block';
                combinedMessageDiv.style.background = '#d1fae5';
                combinedMessageDiv.style.color = '#065f46';
                combinedMessageDiv.style.border = '1px solid #6ee7b7';
                combinedMessageDiv.textContent = 'Assessment data saved successfully!';
                
                // Count'u güncelle
                if (countResult.assessment_count) {
                    countDisplay.textContent = countResult.assessment_count;
                }
            } else {
                const errors = [];
                if (countResult.error) errors.push(`Counts: ${countResult.error}`);
                if (percentageResult.error) errors.push(`Percentages: ${percentageResult.error}`);
                
                combinedMessageDiv.style.display = 'block';
                combinedMessageDiv.style.background = '#fee2e2';
                combinedMessageDiv.style.color = '#dc2626';
                combinedMessageDiv.style.border = '1px solid #fca5a5';
                combinedMessageDiv.innerHTML = errors.length > 0 ? errors.join('<br>') : 'Save failed';
            }
        })
        .catch(error => {
            combinedMessageDiv.style.display = 'block';
            combinedMessageDiv.style.background = '#fee2e2';
            combinedMessageDiv.style.color = '#dc2626';
            combinedMessageDiv.style.border = '1px solid #fca5a5';
            combinedMessageDiv.textContent = error;
        });
    });
    
    // Assessment Percentages Section
    const percentagesForm = document.getElementById('assessment-percentages-form');
    const percentageCountDisplay = document.getElementById('percentage-count-display');
    
    // Percentage input değişikliklerinde toplamı güncelle
    const percentageInputs = percentagesForm.querySelectorAll('input[type="number"]');
    percentageInputs.forEach(input => {
        input.addEventListener('input', function() {
            updatePercentageTotal();
        });
    });
    
    function updatePercentageTotal() {
        let total = 0;
        percentageInputs.forEach(input => {
            const value = parseInt(input.value) || 0;
            total += value;
        });
        percentageCountDisplay.textContent = total;
    }
    
    // Sayfa yüklendiğinde percentage toplamını güncelle
    updatePercentageTotal();
    
})();
</script>

{% endblock %}
