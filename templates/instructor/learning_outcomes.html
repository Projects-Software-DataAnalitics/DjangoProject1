<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning Outcomes</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script>
        (function() {
            const instructorData = JSON.parse(sessionStorage.getItem('loggedInstructor') || 'null');
            if (!instructorData) {
                window.location.href = "/";
                return;
            }
            
            if (!window.location.search.includes('username=')) {
                const currentUrl = new URL(window.location.href);
                currentUrl.searchParams.set('username', instructorData.username);
                window.location.href = currentUrl.toString();
                return;
            }
        })();
    </script>
</head>
<body>
<div class="sidebar" id="sidebar">
    <ul>
        <li id="personal-info-btn">Personal Information</li>
        <li id="my-courses-btn">My Courses</li>
        <li id="grades-btn">Grades</li>
        <li><a href="{% url 'learning_outcomes' %}" id="learning-outcomes-link">Learning Outcomes</a></li>
        <li id="announcements-btn">Announcements</li>
        <li id="logout-btn">Logout</li>
    </ul>
</div>

<div class="content" id="content">
    <button class="menu-btn" id="menu-btn">☰</button>
    <div style="margin-left: 0; margin-top: 10px;">
        <h1 style="font-size: 32px; margin: 0;">Learning Outcomes</h1>
    </div>

    <p style="margin-left: 0; margin-bottom: 16px; color: #474a53; font-size: 20px; font-weight: 600;">
        Select a course to see the learning outcomes.
    </p>

    <div style="margin-top: 12px; margin-bottom: 28px;">
        <h2 style="margin-bottom: 12px;">My Courses</h2>
        <table class="grades-table">
            <thead>
            <tr>
                <th>Course</th>
            </tr>
            </thead>
            <tbody id="courses-list-body">
            </tbody>
        </table>
    </div>

    <script>
        (function () {
            const tbody = document.getElementById("courses-list-body");
            const baseUrl = "{% url 'course_learning_outcomes' course_name='COURSE_NAME_PLACEHOLDER' %}";
            const instructorData = JSON.parse(sessionStorage.getItem('loggedInstructor'));
            
            if (!instructorData) {
                window.location.href = "/";
                return;
            }

            const usernameParam = `?username=${encodeURIComponent(instructorData.username)}`;

            function addRow(courseName) {
                const tr = document.createElement("tr");
                tr.dataset.course = courseName;
                tr.style.cursor = "pointer";
                tr.innerHTML = `
                    <td>${courseName}</td>
                `;
                tbody.appendChild(tr);
            }

            function ensureFallbackRow() {
                if (!tbody.children.length) {
                    tbody.innerHTML = `<tr><td>No courses available.</td></tr>`;
                }
            }

            (instructorData.courses || []).forEach(courseName => {
                addRow(courseName);
            });

            ensureFallbackRow();

            const learningOutcomesLink = document.getElementById("learning-outcomes-link");
            if (learningOutcomesLink) {
                const url = new URL(learningOutcomesLink.href);
                url.searchParams.set('username', instructorData.username);
                learningOutcomesLink.href = url.toString();
            }

            tbody.addEventListener("click", function (e) {
                const row = e.target.closest("tr");
                if (!row || !row.dataset.course) return;
                const course = row.dataset.course;
                const url = baseUrl.replace('COURSE_NAME_PLACEHOLDER', encodeURIComponent(course)) + usernameParam;
                window.location.href = url;
            });
        })();
    </script>

<script src="{% static 'js/instructor.js' %}"></script>
</div>
</body>
</html>
