<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning Outcomes</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script>
        (function() {
            const instructorData = JSON.parse(sessionStorage.getItem('loggedInstructor') || 'null');
            if (!instructorData) {
                window.location.href = "/";
                return;
            }
            
        })();
    </script>
</head>
<body>
<div class="sidebar" id="sidebar">
    <ul>
        <li id="personal-info-btn">Personal Information</li>
        <li id="my-courses-btn">My Courses</li>
        <li id="grades-btn">Grades</li>
        <li><a href="{% url 'learning_outcomes' %}" id="learning-outcomes-link">Learning Outcomes</a></li>
        <li id="announcements-btn">Announcements</li>
        <li id="logout-btn">Logout</li>
    </ul>
</div>

<div class="content" id="content">
    <button class="menu-btn" id="menu-btn">☰</button>
    <div style="margin-left: 0; margin-top: 10px;">
        <h1 style="font-size: 32px; margin: 0;">Learning Outcomes</h1>
    </div>

    <p style="margin-left: 0; margin-bottom: 16px; color: #64748b; font-size: 16px; line-height: 1.6;">
        Select a course to set the learning outcomes and link them to program outcomes.
    </p>

    <div style="margin-top: 12px; margin-bottom: 28px; margin-left: 8px; width: 50%;">
        <table class="grades-table" style="width: 100%;">
            <thead>
            <tr>
                <th>My Courses</th>
            </tr>
            </thead>
            <tbody id="courses-list-body">
            </tbody>
        </table>
    </div>

    <script>
        (function () {
            const tbody = document.getElementById("courses-list-body");
            const baseUrl = "{% url 'course_learning_outcomes' course_name='COURSE_NAME_PLACEHOLDER' %}";
            const storedData = sessionStorage.getItem('loggedInstructor');
            
            if (!storedData) {
                window.location.href = "/";
                return;
            }

            const jsonPathElement = document.getElementById('instructor-json-path');
            const jsonPath = jsonPathElement ? jsonPathElement.dataset.path : '/static/json/instructors.json';
            
            fetch(jsonPath + '?t=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    const storedInstructor = JSON.parse(storedData);
                    const currentInstructor = data.find(i => i.username === storedInstructor.username);
                    if (currentInstructor) {
                        sessionStorage.setItem('loggedInstructor', JSON.stringify(currentInstructor));
                        displayCourses(currentInstructor);
                    } else {
                        displayCourses(storedInstructor);
                    }
                })
                .catch(() => {
                    const storedInstructor = JSON.parse(storedData);
                    displayCourses(storedInstructor);
                });

            function displayCourses(data) {
                tbody.innerHTML = '';
                
                function addRow(courseName) {
                    const tr = document.createElement("tr");
                    tr.dataset.course = courseName;
                    tr.style.cursor = "pointer";
                    tr.innerHTML = `
                        <td>${courseName}</td>
                    `;
                    tbody.appendChild(tr);
                }

                function ensureFallbackRow() {
                    if (!tbody.children.length) {
                        tbody.innerHTML = `<tr><td>No courses available.</td></tr>`;
                    }
                }

                (data.courses || []).forEach(courseName => {
                    addRow(courseName);
                });

                ensureFallbackRow();

                tbody.addEventListener("click", function (e) {
                    const row = e.target.closest("tr");
                    if (!row || !row.dataset.course) return;
                    const course = row.dataset.course;
                    const courseSlug = course.replace(/\s+/g, '-');
                    const url = baseUrl.replace('COURSE_NAME_PLACEHOLDER', courseSlug);
                    window.location.href = url;
                });
            }
        })();
    </script>

<script id="instructor-json-path" data-path="{% static 'json/instructors.json' %}"></script>
<script src="{% static 'js/instructor.js' %}"></script>
<script>
    (function() {
        document.getElementById("personal-info-btn").addEventListener("click", function() {
            window.location.href = "{% url 'instructor_profile' %}";
        });
        document.getElementById("my-courses-btn").addEventListener("click", function() {
            window.location.href = "{% url 'instructor_my_courses' %}";
        });
        document.getElementById("grades-btn").addEventListener("click", function() {
            window.location.href = "{% url 'instructor_grades' %}";
        });
        document.getElementById("announcements-btn").addEventListener("click", function() {
            window.location.href = "{% url 'instructor_announcements' %}";
        });
        document.getElementById("logout-btn").addEventListener("click", function() {
            sessionStorage.clear();
            window.location.href = "/";
        });
    })();
</script>
</div>
</body>
</html>
